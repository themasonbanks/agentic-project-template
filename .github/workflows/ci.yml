name: Project CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  template_validation:
    name: Template validation
    if: github.repository == 'themasonbanks/agentic-project-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.13.0
      - run: npm install --global pnpm@12.16.1
      - run: pnpm --dir adapters/pnpm-typescript install --frozen-lockfile
      - run: pnpm --dir adapters/pnpm-typescript check
      - run: python3 scripts/test_local_checks.py
      - run: python3 scripts/test_ci_runner.py
      - run: python3 scripts/validate_template.py
      - run: ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}", File::FNM_DOTMATCH).push(".coderabbit.yaml").each { |path| YAML.load_file(path) }'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() }}
        with:
          name: template-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            adapters/pnpm-typescript/test-results/
            adapters/pnpm-typescript/coverage/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
  quality:
    name: Project checks
    if: github.repository != 'themasonbanks/agentic-project-template'
    uses: themasonbanks/agentic-platform/.github/workflows/project-checks.yml@07d41ba350e6b6586500b4c51a51a976d8046900
  ci:
    name: CI
    if: always()
    needs: [template_validation, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TEMPLATE_RESULT: ${{ needs.template_validation.result }}
      PROJECT_RESULT: ${{ needs.quality.result }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - run: |
          if [ "$SOURCE_REPOSITORY" = themasonbanks/agentic-project-template ]; then
            test "$TEMPLATE_RESULT" = success
          else
            test "$PROJECT_RESULT" = success
          fi
